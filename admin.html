
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1">
  <title>地磁資料採集系統</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
<main>
  <h1>地磁資料採集系統</h1>
  <p class="muted">
    真正磁力計 μT · 3 秒採集 · 10 筆批次上傳
  </p>

  <section class="card">
    <label for="point">定位點編號</label>
    <input
      id="point"
      inputmode="numeric"
      placeholder="例如 21"
      autocomplete="off"
    >
    <p class="muted">
      只需輸入數字，方向及資料編號由程式判斷。
    </p>
  </section>

  <section class="card">
    <h2>即時感測器</h2>

    <div class="compass">
      <span class="north">N</span>
      <span class="needle" id="needle">▲</span>
    </div>

    <p style="text-align:center">
      <strong id="heading">方向未確認</strong>
      · <span id="degrees">--°</span>
    </p>

    <p style="text-align:center">
      預計資料 ID：
      <strong id="recordId">--</strong>
    </p>

    <div class="row">
      <div class="metric">
        X
        <strong id="x">--</strong>
        <small>μT</small>
      </div>

      <div class="metric">
        Y
        <strong id="y">--</strong>
        <small>μT</small>
      </div>

      <div class="metric">
        Z
        <strong id="z">--</strong>
        <small>μT</small>
      </div>
    </div>

    <p>
      <button id="startSensors">啟動感測器</button>
    </p>

    <p class="status" id="sensorStatus">
      尚未啟動
    </p>

    <p class="muted hint">
      請保持手機平放、遠離磁鐵及大型金屬物。
      方向必須是相對北方的羅盤角度，
      不能把一般 alpha 旋轉角度直接當方位角。
    </p>
  </section>

  <section class="card">
    <h2>採集資料</h2>

    <p>
      按一次收集 3 秒，取其中 10 筆有效磁場讀數。
      採集時請固定手機位置和朝向。
    </p>

    <button id="collect" disabled>
      開始採集（3 秒 / 10 筆）
    </button>

    <button id="upload" class="secondary" disabled>
      上傳 10 筆
    </button>

    <p class="status" id="collectStatus">
      等待感測器啟動
    </p>

    <div class="scroll">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>方向</th>
            <th>X μT</th>
            <th>Y μT</th>
            <th>Z μT</th>
            <th>強度 μT</th>
          </tr>
        </thead>
        <tbody id="preview"></tbody>
      </table>
    </div>
  </section>
</main>

<script src="config.js"></script>
<script src="magnetometer.js"></script>
<script src="collector.js"></script>
</body>
</html>
