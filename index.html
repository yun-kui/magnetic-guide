<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>展場智慧地磁自動導覽 - 遊客端</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🏛️ 展場智慧地磁自動導覽</h1>
        <div id="status" class="status-box">正在從雲端載入展物地磁資料...</div>
        
        <div class="card">
            <h3>當前環境磁場數值 (已正規化)</h3>
            <p>X 軸: <span id="val-x">0.00</span></p>
            <p>Y 軸: <span id="val-y">0.00</span></p>
            <p>Z 軸: <span id="val-z">0.00</span></p>
        </div>

        <div id="guide-section" class="guide-box" style="display: none;">
            <h2 id="exhibit-title">目前位置：尋找中...</h2>
            <p id="exhibit-content">請在展場中移動以觸發導覽...</p>
        </div>

        <button id="start-btn" onclick="requestSensors()">點擊啟動自動導覽</button>
    </div>

    <script>
        // ⚠️ 請將這裡替換成你在 Google Apps Script 部署後取得的「網頁應用程式網址」
        const API_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL";
        
        let exhibitDatabase = [];

        // 1. 自動載入 Google 試算表的展物地磁資料庫
        async function loadDatabase() {
            try {
                let response = await fetch(API_URL);
                exhibitDatabase = await response.json();
                document.getElementById('status').innerText = "展物資料庫載入成功！請點擊下方按鈕啟動感測器。";
            } catch (error) {
                document.getElementById('status').innerText = "載入資料失敗，請檢查 API 網址是否正確。";
                console.error(error);
            }
        }
        loadDatabase();

        // 2. 請求 iOS / Android 授權並監聽感測器
        function requestSensors() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                // iOS 13+ 權限請求
                DeviceOrientationEvent.requestPermission().then(response => {
                    if (response === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation, true);
                        document.getElementById('status').innerText = "感測器已啟動，正在感應環境地球磁場...";
                        document.getElementById('start-btn').style.display = 'none';
                    } else {
                        alert("需要授權感測器才能使用自動導覽！");
                    }
                }).catch(console.error);
            } else {
                // Android 或其他支援的瀏覽器
                window.addEventListener('deviceorientation', handleOrientation, true);
                document.getElementById('status').innerText = "感測器已啟動，正在感應環境地球磁場...";
                document.getElementById('start-btn').style.display = 'none';
            }
        }

        // 3. 接收手機磁力/方向數據並進行「正規化」與「比對」
        function handleOrientation(event) {
            let rawX = event.beta ? event.beta / 90 : 0;   
            let rawY = event.gamma ? event.gamma / 90 : 0; 
            let rawZ = event.alpha ? event.alpha / 360 : 0;

            // 進行向量正規化 (Normalization: 讓數值穩定、消除雜訊)
            let magnitude = Math.sqrt(rawX * rawX + rawY * rawY + rawZ * rawZ);
            let normX = magnitude ? (rawX / magnitude).toFixed(2) : 0;
            let normY = magnitude ? (rawY / magnitude).toFixed(2) : 0;
            let normZ = magnitude ? (rawZ / magnitude).toFixed(2) : 0;

            // 畫面上即時顯示當前正規化數值
            document.getElementById('val-x').innerText = normX;
            document.getElementById('val-y').innerText = normY;
            document.getElementById('val-z').innerText = normZ;

            // 比對資料庫尋找最近的展物
            checkNearestExhibit(parseFloat(normX), parseFloat(normY), parseFloat(normZ));
        }

        // 4. 比對演算法（利用歐幾里得距離與容許誤差）
        function checkNearestExhibit(x, y, z) {
            let matched = null;
            let minDistance = 999;

            for (let exhibit of exhibitDatabase) {
                let dx = x - parseFloat(exhibit.mag_x);
                let dy = y - parseFloat(exhibit.mag_y);
                let dz = z - parseFloat(exhibit.mag_z);
                let distance = Math.sqrt(dx * dx + dy * dy + dz * dz);

                // 如果距離小於試算表設定的 tolerance（容許誤差）
                if (distance <= parseFloat(exhibit.tolerance) && distance < minDistance) {
                    minDistance = distance;
                    matched = exhibit;
                }
            }

            let guideBox = document.getElementById('guide-section');
            if (matched) {
                guideBox.style.display = 'block';
                document.getElementById('exhibit-title').innerText = "📍 " + matched.name;
                document.getElementById('exhibit-content').innerText = matched.content;
            }
        }
    </script>
</body>
</html>
