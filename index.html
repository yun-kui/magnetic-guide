<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧展場自動導覽</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🏛️ 展場智慧定位導覽</h1>
        <div id="status" class="status-box">正在初始化感測器與載入資料...</div>
        
        <div class="card">
            <h3>真正磁力計數值（μT）</h3>
            <p>X 軸: <span id="val-x">0.00</span></p>
            <p>Y 軸: <span id="val-y">0.00</span></p>
            <p>Z 軸: <span id="val-z">0.00</span></p>
        </div>

        <div id="guide-section" class="guide-box" style="display: none;">
            <h2 id="exhibit-title">目前位置：尋找中...</h2>
            <p id="exhibit-content">請在展場中移動以觸發導覽...</p>
        </div>

        <button id="start-btn" onclick="requestSensors()">點擊啟動感測器</button>
    </div>

    <script>
const API_URL = "https://script.google.com/macros/s/AKfycbzwjQ8iJ4CvFyD8-xZpkH0DjzML8Dz2AR101hW6wxQwQQaYcSs3S6RS5tqN4eq6BpaU-g/exec";
let sensor = null, latest = null, samples = [];
const $ = id => document.getElementById(id);
function status(msg) { $('status').textContent = msg; }
async function requestSensors() {
  if (!window.isSecureContext || !('Magnetometer' in window)) {
    status('此瀏覽器無法讀取真正的磁力計。請使用支援 Magnetometer API 的 Android 瀏覽器，或改用原生 App。');
    return;
  }
  try {
    sensor = new Magnetometer({frequency: 10});
    sensor.addEventListener('reading', () => {
      const v = [sensor.x,sensor.y,sensor.z];
      if (!v.every(Number.isFinite)) return;
      latest = v;
      samples.push(v);
      if (samples.length > 30) samples.shift();
      ['x','y','z'].forEach((k,i) => $('val-'+k).textContent = v[i].toFixed(4));
      onReading(v);
    });
    sensor.addEventListener('error', e => status('磁力計讀取失敗：'+(e.error?.message || '權限或硬體不支援')));
    sensor.start();
    status('磁力計已啟動，顯示單位為 μT；請保持手機姿態一致。');
    $('start-btn').disabled = true;
  } catch (e) { status('無法啟動磁力計：'+e.message); }
}
function onReading(v) {}
function averageSamples() {
  if (samples.length < 10) return null;
  return [0,1,2].map(i => Number((samples.reduce((s,v)=>s+v[i],0)/samples.length).toFixed(4)));
}

let exhibitDatabase=[];
async function loadDatabase() {
  try {
    const r=await fetch(API_URL);
    if(!r.ok) throw Error('HTTP '+r.status);
    const data=await r.json();
    // 只比對新版真正磁力計資料，避免舊角度資料混入
    exhibitDatabase=data.filter(x=>x.data_type==='magnetometer_uT' && [x.mag_x,x.mag_y,x.mag_z].every(v=>v!=='' && Number.isFinite(Number(v))));
    status('載入 '+exhibitDatabase.length+' 筆真正地磁資料，請啟動感測器。');
  } catch(e) {status('資料庫載入失敗：'+e.message);}
}
let lastPoint='', consecutive=0;
function onReading() {
  const v=averageSamples();
  if(!v || !exhibitDatabase.length) return;
  let best=null, distance=Infinity;
  for(const row of exhibitDatabase) {
    const d=Math.hypot(...v.map((x,i)=>x-Number([row.mag_x,row.mag_y,row.mag_z][i])));
    if(d<distance) {best=row;distance=d;}
  }
  const tolerance=Number(best?.tolerance);
  if(!best || !(tolerance>0) || distance>tolerance) {
    lastPoint='';consecutive=0;
    $('guide-section').style.display='none';
    return;
  }
  const point=String(best.id).split('-')[0];
  if(point===lastPoint) consecutive++; else {lastPoint=point;consecutive=1;}
  if(consecutive<5) return;
  $('guide-section').style.display='block';
  $('exhibit-title').textContent='📍 '+(best.name||best.id);
  $('exhibit-content').textContent=(best.content||'')+'
距離：'+distance.toFixed(2)+' μT';
}
loadDatabase();
    </script>
</body>
</html>
